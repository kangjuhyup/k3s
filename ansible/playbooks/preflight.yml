---
- name: Inspect selected K3s hosts without host configuration changes
  hosts: k3s_servers:k3s_agents
  gather_facts: false
  become: true
  any_errors_fatal: true
  pre_tasks:
    - name: Validate local inputs and token mapping
      ansible.builtin.import_tasks: tasks/validate-input.yml
  roles:
    - k3s_preflight
