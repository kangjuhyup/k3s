---
- name: Join only selected new agents without modifying the existing server
  hosts: k3s_agents
  gather_facts: false
  become: true
  any_errors_fatal: true
  serial: 1
  pre_tasks:
    - name: Reject misleading check-mode installation
      ansible.builtin.assert:
        that: not ansible_check_mode
        fail_msg: Use preflight.yml for inspection; check mode does not verify a new installation.
    - name: Validate local inputs and token mapping
      ansible.builtin.import_tasks: tasks/validate-input.yml
  roles:
    - k3s_preflight
    - host_prepare
    - k3s_agent
