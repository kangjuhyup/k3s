---
- name: Validate Wasabi credentials only when remote backup is enabled
  ansible.builtin.assert:
    that:
      - lookup('ansible.builtin.env', 'WASABI_ACCESS_KEY_ID') is match('^[A-Za-z0-9]+$')
      - lookup('ansible.builtin.env', 'WASABI_SECRET_ACCESS_KEY') is match('^[A-Za-z0-9/+=]+$')
    quiet: true
  no_log: true
  when: k3s_plan.config.get('etcd-s3', false)

- name: Deliver protected Wasabi credentials for explicitly enabled backups
  ansible.builtin.copy:
    content: |
      AWS_ACCESS_KEY_ID={{ lookup('ansible.builtin.env', 'WASABI_ACCESS_KEY_ID') }}
      AWS_SECRET_ACCESS_KEY={{ lookup('ansible.builtin.env', 'WASABI_SECRET_ACCESS_KEY') }}
    dest: /etc/rancher/k3s/wasabi.env
    owner: root
    group: root
    mode: '0600'
  no_log: true
  diff: false
  when: k3s_plan.config.get('etcd-s3', false)
  register: backup_credentials_result
