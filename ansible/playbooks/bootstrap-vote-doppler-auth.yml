---
- name: Bootstrap Vote production Doppler authentication only
  hosts: localhost
  connection: local
  gather_facts: false
  tasks:
    - name: Require explicit protected runtime inputs
      ansible.builtin.assert:
        that:
          - not ansible_check_mode
          - doppler_run_config is defined
          - doppler_python is defined
          - doppler_run_config is match('^/')
          - doppler_python is match('^/')
    - name: Create only the missing scoped operator authentication Secret
      ansible.builtin.command:
        argv:
          - '{{ doppler_python }}'
          - '{{ playbook_dir }}/../../scripts/vote_bootstrap_auth.py'
          - --run-config
          - '{{ doppler_run_config }}'
      register: vote_auth_result
      changed_when: "'\"unchanged\": false' in vote_auth_result.stdout"
      no_log: true
      diff: false
