---
- name: Wait for local API readiness using an explicit kubeconfig and context
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig=/etc/rancher/k3s/k3s.yaml
      - --context=default
      - --request-timeout=10s
      - get
      - --raw=/readyz
  changed_when: false
  register: k3s_verify_api_ready
  until: k3s_verify_api_ready.rc == 0
  retries: 36
  delay: 5

- name: Wait for this server node to be Ready
  ansible.builtin.command:
    argv:
      - /usr/local/bin/k3s
      - kubectl
      - --kubeconfig=/etc/rancher/k3s/k3s.yaml
      - --context=default
      - --request-timeout=190s
      - wait
      - --for=condition=Ready
      - "node/{{ inventory_hostname }}"
      - --timeout=180s
  changed_when: false
  register: k3s_verify_node_ready
  until: k3s_verify_node_ready.rc == 0
  retries: 3
  delay: 5

- name: Verify embedded etcd state and health on server nodes
  when: k3s_config.datastore == 'etcd' and k3s_plan.node.role == 'server'
  block:
    - name: Inspect the embedded etcd member directory
      ansible.builtin.stat:
        path: /var/lib/rancher/k3s/server/db/etcd/member
        follow: false
      register: k3s_verify_etcd_member

    - name: Require real root-owned embedded etcd state
      ansible.builtin.assert:
        that:
          - k3s_verify_etcd_member.stat.isdir | default(false)
          - not k3s_verify_etcd_member.stat.islnk | default(true)
          - k3s_verify_etcd_member.stat.uid == 0
        quiet: true

    - name: Check local etcd health using its own CA and client certificate
      ansible.builtin.uri:
        url: https://127.0.0.1:2382/health
        ca_path: /var/lib/rancher/k3s/server/tls/etcd/server-ca.crt
        client_cert: /var/lib/rancher/k3s/server/tls/etcd/client.crt
        client_key: /var/lib/rancher/k3s/server/tls/etcd/client.key
        validate_certs: true
        use_proxy: false
        return_content: true
        timeout: 10
      register: k3s_verify_etcd_health
      until: k3s_verify_etcd_health.status | default(0) == 200 and ((k3s_verify_etcd_health.content | from_json).health | bool)
      retries: 12
      delay: 5

    - name: Read local node role labels
      ansible.builtin.command:
        argv:
          - /usr/local/bin/k3s
          - kubectl
          - --kubeconfig=/etc/rancher/k3s/k3s.yaml
          - --context=default
          - --request-timeout=10s
          - get
          - node
          - "{{ inventory_hostname }}"
          - '-o=jsonpath={.metadata.labels}'
      changed_when: false
      register: k3s_verify_node_labels

    - name: Require this server to carry the etcd role
      ansible.builtin.assert:
        that: "'node-role.kubernetes.io/etcd' in (k3s_verify_node_labels.stdout | from_json)"
        quiet: true
