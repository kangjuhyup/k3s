apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-authz
  namespace: gaegaeting-dev
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: edge-authz
      app.kubernetes.io/part-of: gaegaeting
  template:
    metadata:
      labels: *id001
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: edge-authz
        image: ghcr.io/kangjuhyup/gaegaeting/edge-authz:sha-317f550e3fb4fbd773a606c1d58293e3cf7cb32d@sha256:85eda5d49b432002acb7e5ad0335031c3d0601d7a01363497505f184aa23bcaa
        ports:
        - name: http
          containerPort: 4010
        envFrom:
        - secretRef:
            name: gaegaeting-edge-authz-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
