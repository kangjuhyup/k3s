apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gaegaeting-dev
spec:
  replicas: 1
  template:
    spec:
      containers:
      - name: gateway
        resources:
          requests:
            cpu: 25m
            memory: 128Mi
          limits:
            memory: 512Mi
    metadata:
      annotations:
        infra.oci-a1.example/doppler-config: stg
        gaegaeting.app/account-schema-revision: dd302efac42a37d49ca2e782330a88b9d2d7d46c
