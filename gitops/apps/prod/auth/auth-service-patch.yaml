apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: auth
spec:
  template:
    metadata:
      annotations:
        infra.oci-a1.example/oidc-config-revision: '2026-09-17-1'
    spec:
      containers:
      - name: auth-service
        resources:
          limits:
            memory: 768Mi
          requests:
            cpu: 100m
            memory: 256Mi
        env:
        - name: OIDC_ISSUER
          value: https://auth.rvkang.app
        - name: ADMIN_UI_URL
          value: https://auth.rvkang.app
