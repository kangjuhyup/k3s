apiVersion: v1
kind: ConfigMap
metadata:
  name: redisinsight-access-proxy
  namespace: databases
data:
  envoy.yaml: |
    static_resources:
      listeners:
      - name: access
        address:
          socket_address: {address: 0.0.0.0, port_value: 8080}
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: access
              upgrade_configs:
              - upgrade_type: websocket
              route_config:
                name: redisinsight
                virtual_hosts:
                - name: ui
                  domains: ['*']
                  routes:
                  - match: {prefix: /}
                    route: {cluster: ui, timeout: 60s}
              http_filters:
              - name: envoy.filters.http.jwt_authn
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.jwt_authn.v3.JwtAuthentication
                  providers:
                    cloudflare:
                      issuer: https://purple-credit-718b.cloudflareaccess.com
                      audiences: ['@ACCESS_AUD@']
                      from_headers:
                      - name: Cf-Access-Jwt-Assertion
                      remote_jwks:
                        http_uri:
                          uri: https://purple-credit-718b.cloudflareaccess.com/cdn-cgi/access/certs
                          cluster: cloudflare-jwks
                          timeout: 5s
                        cache_duration: 300s
                  rules:
                  - match: {prefix: /}
                    requires: {provider_name: cloudflare}
              - name: envoy.filters.http.router
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: ui
        connect_timeout: 5s
        type: STATIC
        load_assignment:
          cluster_name: ui
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: 127.0.0.1, port_value: 5540}
      - name: cloudflare-jwks
        connect_timeout: 5s
        type: STRICT_DNS
        dns_lookup_family: V4_ONLY
        load_assignment:
          cluster_name: cloudflare-jwks
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address: {address: purple-credit-718b.cloudflareaccess.com, port_value: 443}
        transport_socket:
          name: envoy.transport_sockets.tls
          typed_config:
            '@type': type.googleapis.com/envoy.extensions.transport_sockets.tls.v3.UpstreamTlsContext
            sni: purple-credit-718b.cloudflareaccess.com
            common_tls_context:
              validation_context:
                trusted_ca: {filename: /etc/ssl/certs/ca-certificates.crt}
                match_typed_subject_alt_names:
                - san_type: DNS
                  matcher: {exact: purple-credit-718b.cloudflareaccess.com}
                - san_type: DNS
                  matcher: {exact: '*.cloudflareaccess.com'}
