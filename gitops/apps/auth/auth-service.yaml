apiVersion: apps/v1
kind: Deployment
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  name: auth-service
  namespace: auth
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: auth-service
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
  template:
    metadata:
      labels:
        app.kubernetes.io/name: auth-service
    spec:
      automountServiceAccountToken: false
      containers:
      - command:
        - node
        - dist/main.js
        env:
        - name: DB_HOST
          valueFrom:
            secretKeyRef:
              key: DB_HOST
              name: auth-runtime
        - name: DB_PORT
          valueFrom:
            secretKeyRef:
              key: DB_PORT
              name: auth-runtime
        - name: DB_NAME
          valueFrom:
            secretKeyRef:
              key: DB_NAME
              name: auth-runtime
        - name: DB_USER
          valueFrom:
            secretKeyRef:
              key: DB_USER
              name: auth-runtime
        - name: DB_PASSWORD
          valueFrom:
            secretKeyRef:
              key: DB_PASSWORD
              name: auth-runtime
        - name: PGSSLMODE
          valueFrom:
            secretKeyRef:
              key: DB_SSLMODE
              name: auth-runtime
        - name: REDIS_HOST
          valueFrom:
            secretKeyRef:
              key: REDIS_HOST
              name: auth-runtime
        - name: REDIS_PORT
          valueFrom:
            secretKeyRef:
              key: REDIS_PORT
              name: auth-runtime
        - name: REDIS_USERNAME
          valueFrom:
            secretKeyRef:
              key: REDIS_USERNAME
              name: auth-runtime
        - name: REDIS_PASSWORD
          valueFrom:
            secretKeyRef:
              key: REDIS_PASSWORD
              name: auth-runtime
        - name: REDIS_DB
          valueFrom:
            secretKeyRef:
              key: REDIS_DB
              name: auth-runtime
        - name: REDIS_KEY_PREFIX
          valueFrom:
            secretKeyRef:
              key: REDIS_KEY_PREFIX
              name: auth-runtime
        - name: REDIS_TLS_ENABLED
          valueFrom:
            secretKeyRef:
              key: REDIS_TLS_ENABLED
              name: auth-runtime
        - name: REDIS_TLS_CA_CERT
          valueFrom:
            secretKeyRef:
              key: REDIS_TLS_CA_CERT
              name: auth-runtime
        - name: REDIS_TLS_CERT
          valueFrom:
            secretKeyRef:
              key: REDIS_TLS_CERT
              name: auth-runtime
        - name: REDIS_TLS_KEY
          valueFrom:
            secretKeyRef:
              key: REDIS_TLS_KEY
              name: auth-runtime
        - name: OIDC_COOKIE_KEYS
          valueFrom:
            secretKeyRef:
              key: OIDC_COOKIE_KEYS
              name: auth-runtime
        - name: JWKS_ENCRYPTION_KEY
          valueFrom:
            secretKeyRef:
              key: JWKS_ENCRYPTION_KEY
              name: auth-runtime
        - name: OTP_TOKEN_SECRET
          valueFrom:
            secretKeyRef:
              key: OTP_TOKEN_SECRET
              name: auth-runtime
        - name: NODE_EXTRA_CA_CERTS
          value: /var/run/auth-db-ca/ca.crt
        - name: NODE_ENV
          value: production
        - name: DB_DRIVER
          value: postgresql
        - name: MIKRO_ORM_LOGGER
          value: silent
        - name: OIDC_TRUST_PROXY
          value: 'true'
        - name: OIDC_ADAPTER_DRIVER
          value: hybrid
        - name: OIDC_ACCESS_TOKEN_FORMAT
          value: opaque
        - name: HTTP_TRUST_PROXY_HOPS
          value: '1'
        - name: HTTP_HSTS_ENABLED
          value: 'true'
        - name: HTTP_HELMET_ENABLED
          value: 'true'
        - name: HTTP_THROTTLE_ENABLED
          value: 'true'
        image: ghcr.io/kangjuhyup/auth/auth-service:main-812ed68@sha256:f759bf458a949e4a917658012f4ecd613cc1093bf256a4cda2e1cb7a4626708c
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
        name: auth-service
        ports:
        - containerPort: 3000
          name: http
        readinessProbe:
          httpGet:
            path: /ready
            port: http
          periodSeconds: 10
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
          readOnlyRootFilesystem: true
        startupProbe:
          failureThreshold: 60
          httpGet:
            path: /health
            port: http
          periodSeconds: 5
        volumeMounts:
        - mountPath: /var/run/auth-db-ca
          name: db-ca
          readOnly: true
        - mountPath: /tmp
          name: tmp
      securityContext:
        fsGroup: 1000
        runAsGroup: 1000
        runAsNonRoot: true
        runAsUser: 1000
        seccompProfile:
          type: RuntimeDefault
      terminationGracePeriodSeconds: 30
      volumes:
      - name: db-ca
        secret:
          secretName: auth-runtime
          items:
          - key: DB_TLS_CA_CERT
            path: ca.crt
      - emptyDir:
          sizeLimit: 32Mi
        name: tmp
