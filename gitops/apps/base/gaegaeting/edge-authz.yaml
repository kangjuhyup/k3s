apiVersion: apps/v1
kind: Deployment
metadata:
  name: edge-authz
  namespace: gaegaeting-dev
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: edge-authz
      app.kubernetes.io/part-of: gaegaeting
  template:
    metadata:
      labels: *id001
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: edge-authz
        image: ghcr.io/kangjuhyup/gaegaeting/edge-authz:sha-7c3733450107934f08130f0ac7d0db1a8f54c59a@sha256:6c5dac638ade2d1c9a71ef2313c2d5a743fe3784cae633f06edfd64363b8553d
        ports:
        - name: http
          containerPort: 4010
        envFrom:
        - secretRef:
            name: gaegaeting-edge-authz-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
