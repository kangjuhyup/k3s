apiVersion: apps/v1
kind: Deployment
metadata:
  name: gateway
  namespace: gaegaeting-dev
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: gateway
      app.kubernetes.io/part-of: gaegaeting
  template:
    metadata:
      labels: *id001
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: gateway
        image: ghcr.io/kangjuhyup/gaegaeting/gateway:sha-6aee44544e7db298be6ac756b7083a6214344e50@sha256:212f126afabf44dc609afa9eeefd620c6a09092c369b492fde4fd84efcdd4715
        ports:
        - name: http
          containerPort: 4000
        envFrom:
        - secretRef:
            name: gaegaeting-gateway-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /gateway/health
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /gateway/health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /gateway/health
            port: http
          periodSeconds: 20
          failureThreshold: 3
