apiVersion: apps/v1
kind: Deployment
metadata:
  name: integration-ui
  namespace: gaegaeting-dev
  annotations:
    argocd.argoproj.io/sync-wave: '20'
spec:
  selector:
    matchLabels: &id001
      app.kubernetes.io/name: integration-ui
      app.kubernetes.io/part-of: gaegaeting
  template:
    metadata:
      labels: *id001
      annotations:
        sidecar.istio.io/inject: 'false'
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: integration-ui
        image: ghcr.io/kangjuhyup/gaegaeting/integration-ui:sha-dd302efac42a37d49ca2e782330a88b9d2d7d46c@sha256:0a47b2a0018a8e13590f9f0747b2ede2c93fbf8899345fc2bc86b97be0adcd5e
        ports:
        - name: http
          containerPort: 8080
        envFrom:
        - secretRef:
            name: gaegaeting-integration-ui-runtime
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        startupProbe:
          httpGet:
            path: /health
            port: http
          failureThreshold: 60
          periodSeconds: 5
        readinessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 10
        livenessProbe:
          httpGet:
            path: /health
            port: http
          periodSeconds: 20
          failureThreshold: 3
