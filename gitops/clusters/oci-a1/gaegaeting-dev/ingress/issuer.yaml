apiVersion: cert-manager.io/v1
kind: Issuer
metadata:
  name: gaegaeting-dev-cloudflare
  namespace: istio-system
  annotations:
    argocd.argoproj.io/sync-wave: '-15'
spec:
  acme:
    privateKeySecretRef:
      name: gaegaeting-dev-acme-account
    server: https://acme-v02.api.letsencrypt.org/directory
    solvers:
    - dns01:
        cloudflare:
          apiTokenSecretRef:
            key: api-token
            name: gaegaeting-dev-cloudflare-dns
      selector:
        dnsNames:
        - test-ggt-ui.rvkang.app
        - test-ggt-api.rvkang.app
