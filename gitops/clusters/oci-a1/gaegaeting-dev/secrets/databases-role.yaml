apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gaegaeting-dev-secret-writer
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gaegaeting-account-db-identity
  - gaegaeting-match-db-identity
  - gaegaeting-db-provision-runtime
  - gaegaeting-db-provision-tls
  verbs:
  - update
