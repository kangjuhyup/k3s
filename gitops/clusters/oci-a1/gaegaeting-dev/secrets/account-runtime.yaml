apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gaegaeting-dev-account-runtime
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: gaegaeting
  config: stg
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-gaegaeting-stg
    namespace: doppler-operator-system
  managedSecret:
    name: gaegaeting-account-runtime
    namespace: gaegaeting-dev
    type: Opaque
  secrets:
  - NODE_ENV
  - INTERNAL_AUTH_ASSERTION_SECRET
  - DATABASE_HOST
  - DATABASE_PORT
  - DATABASE_SSL_MODE
  - DATABASE_SYNCHRONIZE
  - ACCOUNT_SERVICE_API_PORT
  - SLACK_WEBHOOK_URL
  - REGISTRATION_DI_HMAC_SECRET
  - REGISTRATION_DI_HMAC_KEY_VERSION
  - REGISTRATION_SERVICE_TOKEN
  - REGISTRATION_MOCK_ENABLED
  - AUTH_BASE_URL
  - AUTH_ISSUER
  - AUTH_TENANT_CODE
  - AUTH_PROVISIONING_CLIENT_ID
  - AUTH_PROVISIONING_CLIENT_SECRET
  - PUBLIC_DATA_API_KEY
  - REDIS_HOST
  - REDIS_PORT
  - STORAGE_HOST
  - STORAGE_PET_BUCKET
  - STORAGE_USER_BUCKET
  - STORAGE_PROFILE_PREFIX
  - STORAGE_REGION
  - STORAGE_ACCESS_KEY_ID
  - STORAGE_SECRET_ACCESS_KEY
  - ACCOUNT_DATABASE_NAME
  - ACCOUNT_DATABASE_USERNAME
  - ACCOUNT_DATABASE_PASSWORD
  processors:
    NODE_ENV:
      type: plain
      asName: NODE_ENV
    INTERNAL_AUTH_ASSERTION_SECRET:
      type: plain
      asName: INTERNAL_AUTH_ASSERTION_SECRET
    DATABASE_HOST:
      type: plain
      asName: DATABASE_HOST
    DATABASE_PORT:
      type: plain
      asName: DATABASE_PORT
    DATABASE_SSL_MODE:
      type: plain
      asName: DATABASE_SSL_MODE
    DATABASE_SYNCHRONIZE:
      type: plain
      asName: DATABASE_SYNCHRONIZE
    ACCOUNT_SERVICE_API_PORT:
      type: plain
      asName: ACCOUNT_SERVICE_API_PORT
    SLACK_WEBHOOK_URL:
      type: plain
      asName: SLACK_WEBHOOK_URL
    REGISTRATION_DI_HMAC_SECRET:
      type: plain
      asName: REGISTRATION_DI_HMAC_SECRET
    REGISTRATION_DI_HMAC_KEY_VERSION:
      type: plain
      asName: REGISTRATION_DI_HMAC_KEY_VERSION
    REGISTRATION_SERVICE_TOKEN:
      type: plain
      asName: REGISTRATION_SERVICE_TOKEN
    REGISTRATION_MOCK_ENABLED:
      type: plain
      asName: REGISTRATION_MOCK_ENABLED
    AUTH_BASE_URL:
      type: plain
      asName: AUTH_BASE_URL
    AUTH_ISSUER:
      type: plain
      asName: AUTH_ISSUER
    AUTH_TENANT_CODE:
      type: plain
      asName: AUTH_TENANT_CODE
    AUTH_PROVISIONING_CLIENT_ID:
      type: plain
      asName: AUTH_PROVISIONING_CLIENT_ID
    AUTH_PROVISIONING_CLIENT_SECRET:
      type: plain
      asName: AUTH_PROVISIONING_CLIENT_SECRET
    PUBLIC_DATA_API_KEY:
      type: plain
      asName: PUBLIC_DATA_API_KEY
    REDIS_HOST:
      type: plain
      asName: REDIS_HOST
    REDIS_PORT:
      type: plain
      asName: REDIS_PORT
    STORAGE_HOST:
      type: plain
      asName: STORAGE_HOST
    STORAGE_PET_BUCKET:
      type: plain
      asName: STORAGE_PET_BUCKET
    STORAGE_USER_BUCKET:
      type: plain
      asName: STORAGE_USER_BUCKET
    STORAGE_PROFILE_PREFIX:
      type: plain
      asName: STORAGE_PROFILE_PREFIX
    STORAGE_REGION:
      type: plain
      asName: STORAGE_REGION
    STORAGE_ACCESS_KEY_ID:
      type: plain
      asName: STORAGE_ACCESS_KEY_ID
    STORAGE_SECRET_ACCESS_KEY:
      type: plain
      asName: STORAGE_SECRET_ACCESS_KEY
    ACCOUNT_DATABASE_NAME:
      type: plain
      asName: DATABASE_NAME
    ACCOUNT_DATABASE_USERNAME:
      type: plain
      asName: DATABASE_USERNAME
    ACCOUNT_DATABASE_PASSWORD:
      type: plain
      asName: DATABASE_PASSWORD
