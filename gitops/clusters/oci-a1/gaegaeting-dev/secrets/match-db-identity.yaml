apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gaegaeting-dev-match-db-identity
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: gaegaeting
  config: dev
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-gaegaeting-dev
    namespace: doppler-operator-system
  managedSecret:
    name: gaegaeting-match-db-identity
    namespace: databases
    type: Opaque
  secrets:
  - MATCH_DATABASE_NAME
  - MATCH_DATABASE_USERNAME
  processors:
    MATCH_DATABASE_NAME:
      type: plain
      asName: database
    MATCH_DATABASE_USERNAME:
      type: plain
      asName: username
