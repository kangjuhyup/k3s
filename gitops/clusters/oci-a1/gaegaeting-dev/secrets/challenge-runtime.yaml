apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gaegaeting-dev-challenge-runtime
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: gaegaeting
  config: stg
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-gaegaeting-stg
    namespace: doppler-operator-system
  managedSecret:
    name: gaegaeting-challenge-runtime
    namespace: gaegaeting-dev
    type: Opaque
  secrets:
  - NODE_ENV
  - INTERNAL_AUTH_ASSERTION_SECRET
  - DATABASE_HOST
  - DATABASE_PORT
  - DATABASE_SSL_MODE
  - CHALLENGE_SERVICE_API_PORT
  - CHALLENGE_ACTIVITY_SECRET
  - CHALLENGE_DATABASE_NAME
  - CHALLENGE_DATABASE_USERNAME
  - CHALLENGE_DATABASE_PASSWORD
  - ACCOUNT_SERVICE_URL
  - STORAGE_HOST
  - STORAGE_REGION
  - STORAGE_WALKING_BUCKET
  - STORAGE_ACCESS_KEY_ID
  - STORAGE_SECRET_ACCESS_KEY
  processors:
    NODE_ENV:
      type: plain
      asName: NODE_ENV
    INTERNAL_AUTH_ASSERTION_SECRET:
      type: plain
      asName: INTERNAL_AUTH_ASSERTION_SECRET
    DATABASE_HOST:
      type: plain
      asName: DATABASE_HOST
    DATABASE_PORT:
      type: plain
      asName: DATABASE_PORT
    DATABASE_SSL_MODE:
      type: plain
      asName: DATABASE_SSL_MODE
    CHALLENGE_SERVICE_API_PORT:
      type: plain
      asName: CHALLENGE_SERVICE_API_PORT
    CHALLENGE_ACTIVITY_SECRET:
      type: plain
      asName: CHALLENGE_ACTIVITY_SECRET
    CHALLENGE_DATABASE_NAME:
      type: plain
      asName: DATABASE_NAME
    CHALLENGE_DATABASE_USERNAME:
      type: plain
      asName: DATABASE_USERNAME
    CHALLENGE_DATABASE_PASSWORD:
      type: plain
      asName: DATABASE_PASSWORD
    ACCOUNT_SERVICE_URL:
      type: plain
      asName: ACCOUNT_SERVICE_URL
    STORAGE_HOST:
      type: plain
      asName: STORAGE_HOST
    STORAGE_REGION:
      type: plain
      asName: STORAGE_REGION
    STORAGE_WALKING_BUCKET:
      type: plain
      asName: STORAGE_WALKING_BUCKET
    STORAGE_ACCESS_KEY_ID:
      type: plain
      asName: STORAGE_ACCESS_KEY_ID
    STORAGE_SECRET_ACCESS_KEY:
      type: plain
      asName: STORAGE_SECRET_ACCESS_KEY
