apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: gaegaeting-dev-secret-writer
  namespace: gaegaeting-dev-kafka
  annotations:
    argocd.argoproj.io/sync-wave: '-30'
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resources:
  - secrets
  resourceNames:
  - gaegaeting-kafka-runtime
  verbs:
  - update
