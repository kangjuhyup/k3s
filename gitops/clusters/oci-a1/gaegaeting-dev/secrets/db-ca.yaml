apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gaegaeting-dev-db-ca
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: gaegaeting
  config: dev
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-gaegaeting-dev
    namespace: doppler-operator-system
  managedSecret:
    name: gaegaeting-db-ca
    namespace: gaegaeting-dev
    type: Opaque
  secrets:
  - DATABASE_TLS_CA_CERT
  processors:
    DATABASE_TLS_CA_CERT:
      type: plain
      asName: ca.crt
