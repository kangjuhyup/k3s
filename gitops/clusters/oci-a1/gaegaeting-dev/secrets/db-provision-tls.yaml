apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: gaegaeting-dev-db-provision-tls
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: gaegaeting
  config: stg
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-gaegaeting-stg
    namespace: doppler-operator-system
  managedSecret:
    name: gaegaeting-db-provision-tls
    namespace: databases
    type: Opaque
  secrets:
  - DATABASE_TLS_CA_CERT
  - DB_PROVISION_TLS_CERT
  - DB_PROVISION_TLS_KEY
  processors:
    DATABASE_TLS_CA_CERT:
      type: plain
      asName: ca.crt
    DB_PROVISION_TLS_CERT:
      type: plain
      asName: tls.crt
    DB_PROVISION_TLS_KEY:
      type: plain
      asName: tls.key
