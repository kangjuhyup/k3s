apiVersion: v1
kind: ConfigMap
metadata:
  name: edge-proxy-start
  namespace: gaegaeting-dev
data:
  start.sh: |
    set -eu
    exec /usr/local/bin/envoy --concurrency 1 --config-yaml "$(cat <<EOF
    static_resources:
      listeners:
      - name: api
        address:
          socket_address:
            address: 0.0.0.0
            port_value: 8080
        filter_chains:
        - filters:
          - name: envoy.filters.network.http_connection_manager
            typed_config:
              '@type': type.googleapis.com/envoy.extensions.filters.network.http_connection_manager.v3.HttpConnectionManager
              stat_prefix: gaegaeting_api
              upgrade_configs:
              - upgrade_type: websocket
                enabled: false
              route_config:
                name: api
                virtual_hosts:
                - name: dev
                  domains:
                  - '*'
                  routes:
                  # Gateway authenticates connection_init before opening Chat upstream.
                  # All ordinary HTTP remains behind ext_authz; no direct Chat route.
                  - match:
                      path: /gateway/graphql
                      headers:
                      - name: ':method'
                        string_match:
                          exact: GET
                      - name: upgrade
                        string_match:
                          exact: websocket
                          ignore_case: true
                    route:
                      cluster: gateway
                      timeout: 0s
                      idle_timeout: 0s
                      upgrade_configs:
                      - upgrade_type: websocket
                        enabled: true
                    typed_per_filter_config:
                      envoy.filters.http.ext_authz:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                        disabled: true
                  - match:
                      path: /gateway/graphql
                    route:
                      cluster: gateway
                      timeout: 30s
                  - match:
                      path: /account/graphql
                    route:
                      cluster: account
                      timeout: 30s
                    typed_per_filter_config: &id001
                      envoy.filters.http.ext_authz:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                        disabled: true
                  - match:
                      path: /payment/notifications/google
                    route:
                      cluster: payment
                      timeout: 30s
                    typed_per_filter_config:
                      envoy.filters.http.ext_authz:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                        disabled: true
                  - match:
                      path: /payment/notifications/apple
                    route:
                      cluster: payment
                      timeout: 30s
                    typed_per_filter_config:
                      envoy.filters.http.ext_authz:
                        '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthzPerRoute
                        disabled: true
                  - match:
                      path: /health
                    direct_response:
                      status: 200
                      body:
                        inline_string: ok
                    typed_per_filter_config: *id001
                  - match:
                      prefix: /
                    direct_response:
                      status: 404
                    typed_per_filter_config: *id001
                  response_headers_to_remove:
                  - access-control-allow-origin
                  - access-control-allow-credentials
                  response_headers_to_add:
                  - header:
                      key: access-control-allow-origin
                      value: https://test-ggt-ui.rvkang.app
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
                  - header:
                      key: access-control-allow-credentials
                      value: 'true'
                    append_action: OVERWRITE_IF_EXISTS_OR_ADD
              http_filters:
              - name: envoy.filters.http.lua
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.lua.v3.Lua
                  default_source_code:
                    inline_string: "function envoy_on_request(h)\n h:headers():remove(\"\
                      x-gaegaeting-edge-assertion\")\n h:headers():remove(\"x-gaegaeting-principal\"\
                      )\nend\n"
              - name: envoy.filters.http.ext_authz
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.ext_authz.v3.ExtAuthz
                  failure_mode_allow: false
                  http_service:
                    server_uri:
                      uri: http://${EDGE_AUTHZ_HOST}:4010
                      cluster: edge_authz
                      timeout: 2s
                    authorization_response:
                      allowed_upstream_headers:
                        patterns:
                        - exact: x-gaegaeting-edge-assertion
              - name: envoy.filters.http.router
                typed_config:
                  '@type': type.googleapis.com/envoy.extensions.filters.http.router.v3.Router
      clusters:
      - name: gateway
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: gateway
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: ${GATEWAY_HOST}
                    port_value: 4000
      - name: account
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: account
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: ${ACCOUNT_HOST}
                    port_value: 2800
      - name: edge_authz
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: edge_authz
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: ${EDGE_AUTHZ_HOST}
                    port_value: 4010
      - name: payment
        type: STRICT_DNS
        connect_timeout: 2s
        load_assignment:
          cluster_name: payment
          endpoints:
          - lb_endpoints:
            - endpoint:
                address:
                  socket_address:
                    address: ${PAYMENT_HOST}
                    port_value: 2802
    EOF
    )"
