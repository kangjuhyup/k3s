apiVersion: batch/v1
kind: Job
metadata:
  name: gaegaeting-dev-db-provision-v1
  namespace: databases
  annotations:
    argocd.argoproj.io/sync-wave: '10'
spec:
  suspend: false
  backoffLimit: 0
  activeDeadlineSeconds: 180
  template:
    metadata:
      labels:
        app.kubernetes.io/name: gaegaeting-db-provision
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 26
        runAsGroup: 26
        fsGroup: 26
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: provision
        image: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
        command:
        - /bin/sh
        - -c
        - |
          set -eu
          export PGHOST="$DATABASE_HOST" PGPORT="$DATABASE_PORT" PGUSER=postgres PGDATABASE=postgres PGSSLMODE=verify-full PGSSLROOTCERT=/tls/ca.crt PGSSLCERT=/tls/tls.crt PGSSLKEY=/tls/tls.key
          for service in ACCOUNT MATCH; do
            case "$service" in
              ACCOUNT) export TARGET_DATABASE="$ACCOUNT_DATABASE_NAME" TARGET_USERNAME="$ACCOUNT_DATABASE_USERNAME" TARGET_PASSWORD="$ACCOUNT_DATABASE_PASSWORD" ;;
              MATCH) export TARGET_DATABASE="$MATCH_DATABASE_NAME" TARGET_USERNAME="$MATCH_DATABASE_USERNAME" TARGET_PASSWORD="$MATCH_DATABASE_PASSWORD" ;;
            esac
            if ! psql -X -q -f /sql/provision.sql >/dev/null 2>&1; then echo 'Database provisioning failed; SQL and credentials suppressed.'; exit 1; fi
          done
          echo 'Fresh dev databases and restricted roles prepared.'
        envFrom:
        - secretRef:
            name: gaegaeting-db-provision-runtime
        volumeMounts:
        - name: tls
          mountPath: /tls
          readOnly: true
        - name: sql
          mountPath: /sql
          readOnly: true
        securityContext:
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        resources:
          requests:
            cpu: 50m
            memory: 64Mi
          limits:
            memory: 128Mi
      volumes:
      - name: tls
        secret:
          secretName: gaegaeting-db-provision-tls
          defaultMode: 288
      - name: sql
        configMap:
          name: gaegaeting-dev-db-provision
