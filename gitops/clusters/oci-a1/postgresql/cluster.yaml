apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  annotations:
    argocd.argoproj.io/sync-options: Prune=false,Delete=false
  name: shared-postgres
  namespace: databases
spec:
  bootstrap:
    initdb:
      dataChecksums: true
      database: postgres
      owner: postgres
      postInitSQLRefs:
        secretRefs:
        - key: 01-role.sql
          name: auth-db-private
        - key: 02-database.sql
          name: auth-db-private
        - key: 03-acl.sql
          name: auth-db-private
  enableSuperuserAccess: false
  imageName: ghcr.io/cloudnative-pg/postgresql:18.4-system-trixie@sha256:42708a75345b7a48fdd9257b071830783a97fd228529196b6313187a7198e185
  instances: 1
  postgresql:
    parameters:
      max_connections: '100'
      shared_buffers: 256MB
    pg_hba:
    # Temporary Challenge provisioning gate; removed after the bounded Job completes.
    - hostssl postgres postgres all cert
    - hostssl @/projected/identity/database @/projected/identity/username all scram-sha-256
    - hostssl @/projected/gaegaeting-dev/account/database @/projected/gaegaeting-dev/account/username
      all scram-sha-256
    - hostssl @/projected/gaegaeting-dev/match/database @/projected/gaegaeting-dev/match/username
      all scram-sha-256
    - hostssl sameuser all all scram-sha-256
    - host all all all reject
  projectedVolumeTemplate:
    sources:
    - secret:
        name: auth-db-private
        items:
        - key: database
          path: identity/database
        - key: username
          path: identity/username
    - secret:
        name: gaegaeting-account-db-identity
        items:
        - key: database
          path: gaegaeting-dev/account/database
        - key: username
          path: gaegaeting-dev/account/username
    - secret:
        name: gaegaeting-match-db-identity
        items:
        - key: database
          path: gaegaeting-dev/match/database
        - key: username
          path: gaegaeting-dev/match/username
  resources:
    limits:
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 512Mi
  storage:
    resizeInUseVolumes: false
    size: 10Gi
    storageClass: local-path
