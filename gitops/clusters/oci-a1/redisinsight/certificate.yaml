apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: redisinsight-public
  namespace: istio-system
spec:
  dnsNames: [redis.rvkang.app]
  issuerRef: {group: cert-manager.io, kind: ClusterIssuer, name: argocd-cloudflare}
  privateKey: {algorithm: RSA, rotationPolicy: Always, size: 2048}
  secretName: redisinsight-public-tls
