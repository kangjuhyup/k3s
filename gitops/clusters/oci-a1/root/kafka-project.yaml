apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-kafka
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '-10'
spec:
  description: Shared Kafka broker and scoped secret delivery
  sourceRepos:
  - https://github.com/kangjuhyup/k3s.git
  destinations:
  - namespace: kafka
    server: https://kubernetes.default.svc
  - namespace: doppler-operator-system
    server: https://kubernetes.default.svc
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  namespaceResourceWhitelist:
  - group: ''
    kind: Pod
  - group: ''
    kind: Service
  - group: ''
    kind: PersistentVolumeClaim
  - group: apps
    kind: StatefulSet
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: rbac.authorization.k8s.io
    kind: Role
  - group: rbac.authorization.k8s.io
    kind: RoleBinding
  - group: secrets.doppler.com
    kind: DopplerSecret
