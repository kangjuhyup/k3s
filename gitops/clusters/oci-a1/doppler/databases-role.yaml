apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  annotations:
    argocd.argoproj.io/sync-wave: '0'
  name: doppler-secret-writer
  namespace: databases
rules:
- apiGroups:
  - ''
  resources:
  - secrets
  verbs:
  - create
- apiGroups:
  - ''
  resourceNames:
  - auth-db-credentials
  - auth-db-private
  - auth-redis-credentials
  - shared-redis-master-tls
  - shared-redis-private
  - shared-redis-replica-tls
  resources:
  - secrets
  verbs:
  - update
