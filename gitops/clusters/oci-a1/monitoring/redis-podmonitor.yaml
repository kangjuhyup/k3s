apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  labels:
    release: monitoring
  name: redis
  namespace: monitoring
spec:
  podMetricsEndpoints:
  - interval: 30s
    port: metrics
  podTargetLabels:
  - redis-role
  selector:
    matchLabels:
      app.kubernetes.io/name: redis-metrics
