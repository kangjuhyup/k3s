apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: vote-redis-tls
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: vote
  config: prd
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-vote-prd
    namespace: doppler-operator-system
  managedSecret:
    name: vote-redis-tls
    namespace: vote-dev
    type: Opaque
  secrets:
  - REDIS_TLS_CA_CERT
  - REDIS_TLS_CERT
  - REDIS_TLS_KEY
  processors:
    REDIS_TLS_CA_CERT:
      type: plain
      asName: ca.crt
    REDIS_TLS_CERT:
      type: plain
      asName: tls.crt
    REDIS_TLS_KEY:
      type: plain
      asName: tls.key
