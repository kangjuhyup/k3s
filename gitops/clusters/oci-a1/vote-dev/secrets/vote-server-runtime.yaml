apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: vote-server-runtime
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: vote
  config: prd
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-vote-prd
    namespace: doppler-operator-system
  managedSecret:
    name: vote-server-runtime
    namespace: vote-dev
    type: Opaque
  secrets:
  - DATABASE_HOST
  - DATABASE_PORT
  - DATABASE_NAME
  - DATABASE_USER
  - DATABASE_PASSWORD
  - REDIS_HOST
  - REDIS_PORT
  - REDIS_DB
  - REDIS_USERNAME
  - REDIS_PASSWORD
  - VOTE_AUTHZ_ASSERTION_KEY
  - PERSONAL_DATA_ENCRYPTION_SECRET
  - PARTICIPATION_LINK_SIGNING_KEY
  - PARTICIPATION_LINK_SIGNING_KEY_ID
  - PARTICIPATION_UI_URL
  - PARTICIPATION_ALLOWED_ORIGINS
  - ORGANIZATION_INVITATION_HASH_SECRET
  - VOTE_PROFILE_REGISTRATION_SECRET
  - DATABASE_SSL_COMPAT
  - PGSSLMODE
  - WASABI_ENDPOINT
  - WASABI_REGION
  - WASABI_BUCKET
  - WASABI_ACCESS_KEY_ID
  - WASABI_SECRET_ACCESS_KEY
  - WASABI_KEY_PREFIX
  - WASABI_FORCE_PATH_STYLE
  - WASABI_PRESIGNED_URL_EXPIRES_IN_SECONDS
  processors:
    DATABASE_HOST:
      type: plain
      asName: DATABASE_HOST
    DATABASE_PORT:
      type: plain
      asName: DATABASE_PORT
    DATABASE_NAME:
      type: plain
      asName: DATABASE_NAME
    DATABASE_USER:
      type: plain
      asName: DATABASE_USER
    DATABASE_PASSWORD:
      type: plain
      asName: DATABASE_PASSWORD
    REDIS_HOST:
      type: plain
      asName: REDIS_HOST
    REDIS_PORT:
      type: plain
      asName: REDIS_PORT
    REDIS_DB:
      type: plain
      asName: REDIS_DB
    REDIS_USERNAME:
      type: plain
      asName: REDIS_USERNAME
    REDIS_PASSWORD:
      type: plain
      asName: REDIS_PASSWORD
    VOTE_AUTHZ_ASSERTION_KEY:
      type: plain
      asName: VOTE_AUTHZ_ASSERTION_KEY
    PERSONAL_DATA_ENCRYPTION_SECRET:
      type: plain
      asName: PERSONAL_DATA_ENCRYPTION_SECRET
    PARTICIPATION_LINK_SIGNING_KEY:
      type: plain
      asName: PARTICIPATION_LINK_SIGNING_KEY
    PARTICIPATION_LINK_SIGNING_KEY_ID:
      type: plain
      asName: PARTICIPATION_LINK_SIGNING_KEY_ID
    PARTICIPATION_UI_URL:
      type: plain
      asName: PARTICIPATION_UI_URL
    PARTICIPATION_ALLOWED_ORIGINS:
      type: plain
      asName: PARTICIPATION_ALLOWED_ORIGINS
    ORGANIZATION_INVITATION_HASH_SECRET:
      type: plain
      asName: ORGANIZATION_INVITATION_HASH_SECRET
    VOTE_PROFILE_REGISTRATION_SECRET:
      type: plain
      asName: VOTE_PROFILE_REGISTRATION_SECRET
    DATABASE_SSL_COMPAT:
      type: plain
      asName: DATABASE_SSL
    PGSSLMODE:
      type: plain
      asName: PGSSLMODE
    WASABI_ENDPOINT:
      type: plain
      asName: WASABI_ENDPOINT
    WASABI_REGION:
      type: plain
      asName: WASABI_REGION
    WASABI_BUCKET:
      type: plain
      asName: WASABI_BUCKET
    WASABI_ACCESS_KEY_ID:
      type: plain
      asName: WASABI_ACCESS_KEY_ID
    WASABI_SECRET_ACCESS_KEY:
      type: plain
      asName: WASABI_SECRET_ACCESS_KEY
    WASABI_KEY_PREFIX:
      type: plain
      asName: WASABI_KEY_PREFIX
    WASABI_FORCE_PATH_STYLE:
      type: plain
      asName: WASABI_FORCE_PATH_STYLE
    WASABI_PRESIGNED_URL_EXPIRES_IN_SECONDS:
      type: plain
      asName: WASABI_PRESIGNED_URL_EXPIRES_IN_SECONDS
