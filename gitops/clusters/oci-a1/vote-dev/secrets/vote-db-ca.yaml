apiVersion: secrets.doppler.com/v1alpha1
kind: DopplerSecret
metadata:
  name: vote-db-ca
  namespace: doppler-operator-system
  annotations:
    argocd.argoproj.io/sync-wave: '-20'
spec:
  project: vote
  config: prd
  host: https://api.doppler.com
  verifyTLS: true
  resyncSeconds: 120
  tokenSecret:
    name: doppler-auth-vote-prd
    namespace: doppler-operator-system
  managedSecret:
    name: vote-db-ca
    namespace: vote-dev
    type: Opaque
  secrets:
  - DATABASE_TLS_CA_CERT
  processors:
    DATABASE_TLS_CA_CERT:
      type: plain
      asName: ca.crt
